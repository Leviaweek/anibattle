[project]
name = "anibattle"
version = "0.1.0"
description = "Battles of anime characters"
readme = "README.md"
authors = [
    { name = "leviaweek", email = "a.o.drahun@student.khai.edu" }
]
requires-python = ">=3.14.7"
dependencies = [
    "mypy>=2.3.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
anibattle = "anibattle:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
