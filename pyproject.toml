[project]
name = "anibattle"
version = "0.1.0"
description = "Battles of anime characters"
readme = "README.md"
authors = [{ name = "leviaweek", email = "a.o.drahun@student.khai.edu" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pyright]
# Same mode as the global Zed basedpyright settings
typeCheckingMode = "standard"

[[tool.pyright.executionEnvironments]]
root = "migrations"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult = "none"

[tool.fastapi]
entrypoint = "anibattle.main:app"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.17.4", "sqlfluff>=4.4.0"]
